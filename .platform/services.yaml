db:
    type: 'mariadb:10.4'
    disk: 12288
    configuration:
        schemas:
            - ppsintradb
            - uregniintradb
            - pbniintradb
            - niaomiintradb
            - nipbintradb
            - afbiintradb
            - poniintradb
            - nipsintradb
        endpoints:
            ppsintra:
                default_schema: ppsintradb
                privileges:
                    ppsintradb: admin
            uregniintra:
                default_schema: uregniintradb
                privileges:
                    uregniintradb: admin
            pbniintra:
                default_schema: pbniintradb
                privileges:
                    pbniintradb: admin
            niaomiintra:
                default_schema: niaomiintradb
                privileges:
                    niaomiintradb: admin
            nipbintra:
                default_schema: nipbintradb
                privileges:
                    nipbintradb: admin
            afbiintra:
                default_schema: afbiintradb
                privileges:
                    afbiintradb: admin
            poniintra:
                default_schema: poniintradb
                privileges:
                    poniintradb: admin
            nipsintra:
                default_schema: nipsintradb
                privileges:
                    nipsintradb: admin
solr_9_9:
    type: 'solr:9.9'
    disk: 1024
    configuration:
        modules:
            - extraction
            - analysis-extras
            - langid
            - ltr
        cores:
            ppsintra_index:
                conf_dir: !archive solr_configsets/ppsintra/conf/
            uregniintra_index:
                conf_dir: !archive solr_configsets/uregniintra/conf/
            pbniintra_index:
                conf_dir: !archive solr_configsets/pbniintra/conf/
            niaomiintra_index:
                conf_dir: !archive solr_configsets/niaomiintra/conf/
            nipbintra_index:
                conf_dir: !archive solr_configsets/nipbintra/conf/
            afbiintra_index:
                conf_dir: !archive solr_configsets/afbiintra/conf/
            poniintra_index:
                conf_dir: !archive solr_configsets/poniintra/conf/
            nipsintra_index:
                conf_dir: !archive solr_configsets/nipsintra/conf/
        endpoints:
            ppsintra:
                core: ppsintra_index
            uregniintra:
                core: uregniintra_index
            pbniintra:
                core: pbniintra_index
            niaomiintra:
                core: niaomiintra_index
            nipbintra:
                core: nipbintra_index
            afbiintra:
                core: afbiintra_index
            poniintra:
                core: poniintra_index
            nipsintra:
                core: nipsintra_index
redis:
    type: 'redis:6.0'
