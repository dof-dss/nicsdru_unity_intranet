uuid: 54849ab8-2550-42cc-99a0-3d82decb216e
langcode: en
status: true
dependencies: {  }
id: upgrade_d7_node_complete_publication_page
class: Drupal\node\Plugin\migrate\D7NodeTranslation
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - 'Drupal 7'
  - Content
migration_group: migrate_drupal_7
label: 'Node complete (Publication page)'
source:
  plugin: d7_node_complete
  node_type: publication_page
process:
  nid:
    -
      plugin: get
      source: tnid
  vid:
    -
      plugin: get
      source: vid
  langcode:
    -
      plugin: default_value
      source: language
      default_value: und
  title:
    -
      plugin: get
      source: title
  uid:
    -
      plugin: get
      source: node_uid
  status:
    -
      plugin: get
      source: status
  created:
    -
      plugin: get
      source: created
  changed:
    -
      plugin: get
      source: timestamp
  promote:
    -
      plugin: get
      source: promote
  sticky:
    -
      plugin: get
      source: sticky
  revision_uid:
    -
      plugin: get
      source: revision_uid
  revision_log:
    -
      plugin: get
      source: log
  revision_timestamp:
    -
      plugin: get
      source: timestamp
  content_translation_source:
    -
      plugin: get
      source: source_langcode
  comment_node_publication_page/0/status:
    -
      plugin: get
      source: comment
  field_attachment:
    -
      plugin: sub_process
      source: field_publication_attachment
      process:
        target_id: fid
        display: display
        description: description
  body:
    - plugin: get
      source: body
    - plugin: media_wysiwyg_filter
    - plugin: filter_absolute_links

      replace_urls:
        http://nips.intranet.nigov.net
        https://nips.intranet.nigov.net
    - plugin: site_files_filter
      from_ref: sites/nips/files
      to_ref: files/nipsintra

    - plugin: site_files_filter
      from_ref: sites/nips-intranet/files
      to_ref: files/nipsintra
    - plugin: site_files_filter
      from_ref: sites/nips.intranet.nigov.net/files
      to_ref: files/nipsintra
  body/0/format:
    - plugin: static_map
      bypass: true
      source: body/0/format
      map:
        filtered_html: basic_html
        filtered_html_with_no_images: basic_html
        filtered_html_with_tokens: basic_html
        restricted_html: basic_html
        plain_text: plain_text
  field_publication_date:
    -
      plugin: sub_process
      source: field_publication_date
      process:
        value:
          plugin: format_date
          from_format: 'Y-m-d H:i:s'
          to_format: Y-m-d
          source: value
  field_type:
    - plugin: static_map
      source: field_publication_type
      default_value: null
      map:
        finance: 20
        form: 21
        guidance: 22
        indept_report: 23
        magazine: 24
        minutes: 25
        notices: 7
        orgcharts: 8
        policy: 9
        press_releases: 10
        promo_materiel: 11
        reports: 12
        research: 13
        speeches: 14
        standards: 15
        stats: 16
        surveys: 17
        templates: 18
        transcripts: 19
destination:
  plugin: 'entity_complete:node'
  translations: true
  default_bundle: publication
idMap: {  }
migration_dependencies:
  required:
    - upgrade_d7_user
    - upgrade_d7_node_type
  optional:
    - upgrade_d7_field_instance
include: null
