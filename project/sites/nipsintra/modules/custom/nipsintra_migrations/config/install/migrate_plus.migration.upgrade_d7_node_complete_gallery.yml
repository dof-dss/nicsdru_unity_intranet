field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - 'Drupal 7'
  - Content
migration_group: migrate_drupal_7
label: 'Node complete (Gallery)'
source:
  plugin: d7_node_complete
  node_type: gallery
process:
  nid:
    -
      plugin: get
      source: tnid
  vid:
    -
      plugin: get
      source: vid
  langcode:
    -
      plugin: default_value
      source: language
      default_value: und
  title:
    -
      plugin: get
      source: title
  uid:
    -
      plugin: get
      source: node_uid
  status:
    -
      plugin: get
      source: status
  created:
    -
      plugin: get
      source: created
  changed:
    -
      plugin: get
      source: timestamp
  promote:
    -
      plugin: get
      source: promote
  sticky:
    -
      plugin: get
      source: sticky
  revision_uid:
    -
      plugin: get
      source: revision_uid
  revision_log:
    -
      plugin: get
      source: log
  revision_timestamp:
    -
      plugin: get
      source: timestamp
  content_translation_source:
    -
      plugin: get
      source: source_langcode
  comment_node_gallery/0/status:
    -
      plugin: get
      source: comment
  body:
    - plugin: get
      source: body
    - plugin: media_wysiwyg_filter
    - plugin: filter_absolute_links

      replace_urls:
        http://nips.intranet.nigov.net
        https://nips.intranet.nigov.net
    - plugin: site_files_filter
      from_ref: sites/nips/files
      to_ref: files/nipsintra

    - plugin: site_files_filter
      from_ref: sites/nips-intranet/files
      to_ref: files/nipsintra
    - plugin: site_files_filter
      from_ref: sites/nips.intranet.nigov.net/files
      to_ref: files/nipsintra
  body/0/format:
    - plugin: static_map
      bypass: true
      source: body/0/format
      map:
        filtered_html: basic_html
        filtered_html_with_no_images: basic_html
        filtered_html_with_tokens: basic_html
        restricted_html: basic_html
        plain_text: plain_text
  field_gallery_images:
    -
      plugin: sub_process
      source: field_gallery_images
      process:
        target_id: fid
        alt: alt
        title: title
        width: width
        height: height
destination:
  plugin: 'entity_complete:node'
  translations: true
  default_bundle: gallery
idMap: {  }
